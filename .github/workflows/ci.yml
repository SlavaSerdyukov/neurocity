name: CI

on:
  push:
    branches: [main, deploy/railway-demo]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and tests
        run: pip install ".[dev]"
      - name: Prepare test environment
        run: cp .env.example .env
      - name: Run tests
        run: pytest
