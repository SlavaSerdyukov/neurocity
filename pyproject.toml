[project]
name = "neurocity"
version = "0.1.0"
description = "A local-first autonomous city simulation and socio-economic observability platform."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "jinja2>=3.1.4",
    "sqlmodel>=0.0.21",
    "pydantic-settings>=2.3.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "networkx>=3.3",
    "scipy>=1.13.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

